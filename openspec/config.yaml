schema: spec-driven

context: |
  # D&D Solo Adventure App

  > **Status:** Active development — not deployed anywhere. Breaking changes (schema, API, data model) are safe to make freely.

  A single-player D&D 5e game where Claude acts as the Dungeon Master. LLM handles narrative, NPC roleplay, and game mechanics via tool calling. The world is alive — NPCs pursue agendas, factions shift power, and events unfold independently.

  ## Monorepo Structure
  ```
  /
  ├── apps/
  │   ├── api/    NestJS + GraphQL Yoga + MikroORM
  │   └── web/    Nuxt 3 + Nuxt UI + urql
  ├── docs/
  │   └── superpowers/specs/   Design specs
  └── openspec/   OpenSpec change proposals
  ```

  ## Tech Stack

  ### API
  - NestJS with GraphQL Yoga (code-first schema, SSE-based subscriptions)
  - MikroORM with PostgreSQL (entities, migrations, seeders)
  - pgvector extension for semantic memory search
  - Redis + BullMQ (@nestjs/bullmq) for world tick job queue
  - Anthropic SDK for Claude integration (Sonnet for DM session, Haiku for world tick/diary)
  - Voyage AI SDK for text embeddings (pgvector storage)
  - @nestjs/jwt + passport for JWT auth

  ### Web
  - Nuxt 3 with Nuxt UI v4 components
  - urql as GraphQL client (queries, mutations, SSE subscriptions)

  ## API Modules (9)
  - AuthModule — JWT auth, user registration/login
  - CharacterModule — character creation, sheet, leveling
  - CampaignModule — campaign metadata, in-game date, lore document
  - SessionModule — active game sessions, player input, GameEvent log
  - GameEngineModule — D&D 5e mechanics via LLM tool calls (dice, combat, rests, skills, quests, items)
  - MemoryModule — diary entries + memory facts with pgvector embeddings, 7-day rolling context
  - WorldModule — locations, factions, world events, NPC agendas, world tick, NPC conversations
  - LLMModule — Claude orchestration, SSE streaming, context assembly, prompt caching, dynamic modules
  - QueueModule — BullMQ world tick queue, Redis-backed SRD cache

  ## Key Design Decisions
  - GraphQL subscriptions over SSE (not WebSocket) for LLM streaming
  - GraphQL relay pagination with cursors for all list queries (Connection/Edge/PageInfo pattern); shared helpers live in `apps/api/src/graphql/relay/` (connection args, page info, order-by input, validators)
  - Shared GraphQL infrastructure in `apps/api/src/graphql/`: relay pagination, auth guard, `@CurrentUser`/`@Public` decorators, JSON scalar, `WhereService` for filter inputs
  - Prompt caching: 4 breakpoints (system+modules / campaign state / world+diary / session history)
  - World tick runs via BullMQ after take_long_rest; Redis lock prevents race conditions
  - LLM calls advance_antagonist_stage, record_lore, set_scene_type — server never infers these
  - Quest objectives auto-complete via indexed QuestObjective queries after each tool call
  - Location discovery derived from LocationDiscovery table (map items, NPC dialogue, exploration)
  - NPC agendas processed in batched Haiku calls with lazy evaluation (nextTickInGameDate)
  - Dynamic prompt modules per scene type (COMBAT/SOCIAL/EXPLORATION/SETTLEMENT/REST)
  - Sonnet for DM session stream; Haiku for all background processing
  - MikroORM seeders populate SRD data (spells, monsters, classes, races, equipment, conditions) on first migration

  ## Data Models (summary)
  ### Core
  User, Character, Campaign, GameSession, GameEvent, DiaryEntry, Memory

  ### World
  Location, LocationDiscovery, Map, MapLocation, Faction, WorldEvent

  ### NPCs
  Npc, NpcRelationship, NpcItem

  ### Items & Inventory
  Item, CharacterItem

  ### Quests
  Quest, QuestObjective, QuestEntity

  ### SRD Reference (seeded, read-only)
  SrdClass, SrdRace, SrdSpell, SrdMonster, SrdEquipment, SrdCondition

  ## Constraints
  - All LLM tool calls return structured results the LLM can recover from gracefully
  - No hardcoded model names — config values only

rules:
  tasks:
    - Use conventional commits (feat:, fix:, chore:, test:, docs:)
    - Follow TDD — write the failing test before the implementation
    - One clear responsibility per file/module
    - Document all public classes, methods, and non-obvious logic with JSDoc comments
    - Always add these as the final tasks in every change: run lint, run typecheck, run tests
